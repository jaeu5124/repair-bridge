<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리페어 브릿지</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#2F6B5E">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="리페어 브릿지">
<style>
:root {
  --ink: #1C211F;
  --paper: #E3E5E0;
  --card: #F5F6F3;
  --patina: #2F6B5E;
  --brass: #9A7B1F;
  --rust: #9E3B2A;
  --line: #C0C3BC;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--paper);
  color: var(--ink);
}
#app { max-width: 480px; margin: 0 auto; padding-bottom: 34px; min-height: 100vh; }

.top { padding: 22px 20px 16px; display: flex; gap: 12px; align-items: center; }
.glyph { font-size: 30px; color: var(--patina); line-height: 1; }
.top h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.4px; }
.top p { margin: 2px 0 0; font-size: 12.5px; color: #5C6260; }

.tabs { display: flex; padding: 0 20px; border-bottom: 1px solid var(--line); }
.tabs button {
  flex: 1; background: none; border: none; cursor: pointer; font: inherit;
  padding: 10px 4px; font-size: 13.5px; color: #6B716E;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tabs button.on { color: var(--patina); font-weight: 700; border-bottom-color: var(--patina); }
.tabs button:focus-visible, .drop:focus-visible, textarea:focus, .cta:focus-visible {
  outline: 2px solid var(--patina); outline-offset: 2px;
}

main { padding: 18px 20px 0; }
.hide { display: none; }
.lede { font-size: 13.5px; line-height: 1.65; color: #4A504E; margin: 0 0 16px; }
.empty { font-size: 13.5px; color: #737977; line-height: 1.6; }
.sub { display: block; font-size: 11.5px; color: #737977; margin-top: 3px; line-height: 1.5; }

.drop {
  position: relative;
  border: 1.5px dashed var(--line); border-radius: 4px; background: var(--card);
  min-height: 170px; cursor: pointer; display: flex; align-items: center;
  justify-content: center; overflow: hidden; width: 100%; padding: 0;
}
.drop.over { border-color: var(--patina); background: #DCE7E3; }
.drop input[type=file] {
  position: absolute; inset: 0; width: 100%; height: 100%;
  opacity: 0; cursor: pointer; z-index: 2;
}
.drop:focus-within { outline: 2px solid var(--patina); outline-offset: 2px; }
.drop-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; color: #6B716E; font-size: 13px; font-family: inherit; }
.ghost { width: 100%; margin-top: 8px; padding: 11px; cursor: pointer;
  background: none; border: 1px solid var(--line); border-radius: 4px;
  color: #5C6260; font: inherit; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 7px 12px; font: inherit; font-size: 12.5px; color: #4A504E; cursor: pointer; }
.chip.on { background: var(--patina); border-color: var(--patina); color: #F5F6F3; font-weight: 600; }
.q { margin-bottom: 16px; }
.q-label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; color: #3A403E; }
.freein { width: 100%; padding: 9px 11px; font: inherit; font-size: 12.5px;
  border: 1px solid var(--line); border-radius: 4px; background: var(--card); color: var(--ink); }
.freein:focus { outline: 2px solid var(--patina); outline-offset: 2px; }
.dg { width: 100%; height: auto; margin: 4px 0 2px; display: block; }
.dg .fr { fill: #FFFFFF; stroke: var(--line); stroke-width: 1; }
.dg .ln { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.dg .ac { fill: none; stroke: var(--patina); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.dg .dsh { fill: none; stroke: #9AA09D; stroke-width: 1.2; stroke-dasharray: 3 3; }
.dg .fl, .dg .fl2 { fill: var(--patina); stroke: none; }
.dg .warn { fill: none; stroke: var(--rust); stroke-width: 2.2; stroke-linecap: round; }
.dg .bd { fill: var(--patina); }
.dg .nm { fill: #F5F6F3; font-size: 9px; font-weight: 700; text-anchor: middle; }
.dg .cp { fill: #5C6260; font-size: 9.5px; text-anchor: middle; }
.composed { margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--line); }
.demo { margin: -16px -16px 12px; padding: 8px 14px; background: var(--brass);
  color: #F5F6F3; font-size: 11.5px; line-height: 1.5; }
.opt { margin-top: 14px; }
.opt summary { font-size: 12.5px; color: #737977; cursor: pointer; padding: 6px 0; }
.opt .drop { margin-top: 8px; min-height: 130px; }
.drop-icon { font-size: 26px; color: var(--patina); }
.drop img { width: 100%; max-height: 260px; object-fit: cover; display: block; }

textarea {
  width: 100%; margin-top: 10px; padding: 11px 12px; font: inherit; font-size: 13.5px;
  border: 1px solid var(--line); border-radius: 4px; background: var(--card);
  color: var(--ink); resize: vertical;
}

.cta {
  width: 100%; margin-top: 12px; padding: 13px; cursor: pointer;
  background: var(--patina); color: #F5F6F3; border: none; border-radius: 4px;
  font: inherit; font-size: 14.5px; font-weight: 700;
}
.cta[disabled] { background: #A9AEAB; cursor: default; }
.cta.dark { background: var(--ink); }
.err { color: var(--rust); font-size: 13px; margin-top: 10px; }

.slip { margin-top: 18px; background: var(--card); border: 1px solid var(--line);
  border-top: 3px solid var(--patina); border-radius: 3px; padding: 16px; }
.slip-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.slip h2 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.3px; }
.cat { font-size: 11.5px; color: var(--brass); font-weight: 600; }
.serial { font-size: 10.5px; color: #8A908D; font-variant-numeric: tabular-nums; white-space: nowrap; }

.verdict { margin: 12px 0 4px; padding: 9px 12px; border-radius: 3px;
  background: #DCE7E3; color: var(--patina); font-weight: 800; font-size: 15px;
  display: flex; justify-content: space-between; align-items: baseline; }
.verdict[data-level="전문가 필요"] { background: #EFE6CC; color: var(--brass); }
.verdict[data-level="수리 불가"] { background: #EEDBD6; color: var(--rust); }
.verdict em { font-style: normal; font-size: 11.5px; font-weight: 500; opacity: .8; }

.row { padding: 11px 0; border-bottom: 1px solid var(--line); }
.row:last-of-type { border-bottom: none; }
.row-label { display: block; font-size: 11.5px; color: #7A807D; margin-bottom: 4px; }
.row-body { font-size: 13.5px; line-height: 1.6; }
.row-body ol { margin: 0; padding-left: 18px; }
.row-body li { margin-bottom: 5px; }

.flag { color: var(--rust); font-weight: 700; }
.ok { color: var(--patina); font-weight: 700; }

.safety { margin: 10px 0 0; padding: 10px 12px; font-size: 12.5px; line-height: 1.55;
  background: #EEDBD6; color: var(--rust); border-radius: 3px; }
.gain { margin-top: 12px; padding: 12px; background: #DCE7E3; border-radius: 3px;
  font-size: 14px; color: var(--patina); }
.gain b { font-size: 19px; }
.eu { margin-top: 10px; font-size: 11.5px; line-height: 1.6; color: #5C6260;
  border-left: 2px solid var(--brass); padding-left: 10px; }

.stats { display: flex; gap: 8px; margin-bottom: 18px; }
.stats > div { flex: 1; background: var(--card); border: 1px solid var(--line);
  border-radius: 3px; padding: 12px 8px; text-align: center; }
.stats b { display: block; font-size: 21px; color: var(--patina); font-variant-numeric: tabular-nums; }
.stats span { font-size: 10.5px; color: #737977; }

.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; gap: 11px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.list img { width: 46px; height: 46px; object-fit: cover; border-radius: 3px; flex-shrink: 0; }
.list b { font-size: 14px; }

.reset { margin-top: 18px; background: none; border: 1px solid var(--line);
  color: #737977; padding: 9px 14px; border-radius: 3px; cursor: pointer; font: inherit; font-size: 12.5px; }

.bigstat { background: var(--ink); color: var(--card); border-radius: 3px;
  padding: 20px; text-align: center; margin-bottom: 16px; }
.bigstat b { display: block; font-size: 40px; font-weight: 800; line-height: 1; color: #E8C86A; font-variant-numeric: tabular-nums; }
.bigstat span { font-size: 12.5px; opacity: .85; }

.bars { display: flex; flex-direction: column; gap: 7px; }
.bar { display: flex; align-items: center; gap: 9px; font-size: 12.5px; }
.bar > span { width: 62px; flex-shrink: 0; color: #4A504E; }
.bar > i { height: 15px; background: var(--rust); border-radius: 2px; min-width: 5px; }
.bar > em { font-style: normal; font-size: 11.5px; color: #737977; }

.lost { font-size: 13px; color: var(--rust); margin: 14px 0 0; }
.brief { margin-top: 14px; padding: 14px; background: var(--card);
  border: 1px solid var(--line); border-left: 3px solid var(--brass);
  border-radius: 3px; font: inherit; font-size: 13px; line-height: 1.75;
  white-space: pre-wrap; word-break: keep-all; }

footer { margin-top: 26px; padding: 0 20px; font-size: 11px; color: #868C89; line-height: 1.6; }
</style>

<div id="app">
  <div class="top">
    <span class="glyph">&#8635;</span>
    <div>
      <h1>리페어 브릿지</h1>
      <p>수리할 권리를 앱으로 구현하다</p>
    </div>
  </div>

  <nav class="tabs">
    <button id="t1" class="on">진단</button>
    <button id="t2">수리 이력</button>
    <button id="t3">수리권 데이터</button>
  </nav>

  <main>
    <section id="s1">
      <p class="lede">질문에 답하면 진단 요청서가 자동으로 작성됩니다. 고장 원인, 자가수리 가능 여부, 예상 비용, 부품 조달 상황을 알려드립니다.</p>

      <div id="quiz"></div>

      <div class="composed">
        <span class="row-label">진단 요청 내용 (직접 고쳐도 됩니다)</span>
        <textarea id="note" rows="3" placeholder="위 질문에 답하거나 여기에 직접 적어주세요"></textarea>
      </div>

      <button class="cta" id="run" disabled>진단 받기</button>

      <details class="opt">
        <summary>사진 첨부 (선택)</summary>
        <label class="drop" id="drop">
          <input type="file" id="file" accept="image/*">
          <span class="drop-empty" id="dropinner"><span class="drop-icon">&#43;</span><span>사진 선택 · 끌어놓기 · 붙여넣기</span></span>
        </label>
      </details>
      <div id="out"></div>
    </section>

    <section id="s2" class="hide"></section>
    <section id="s3" class="hide"></section>
  </main>

  <footer>탄소 절감량은 제품군별 제조 단계 배출 추정치를 기준으로 계산한 값입니다.</footer>
</div>

<script>
var CO2 = { "스마트폰":55, "노트북":300, "태블릿":100, "소형가전":30, "대형가전":500, "의류":15, "가구":45, "기타":20 };
var EU_SCOPE = ["스마트폰","태블릿","대형가전"];
var KEY = "repairbridge:records:v1";

var records = [];
var img = null, b64 = null, mime = "image/jpeg", current = null;
var demoMode = false;

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function num(n) { return (Number(n) || 0).toLocaleString(); }

/* 저장 — 배포 환경에서는 브라우저 저장소를 쓴다 */
async function load() {
  try {
    if (window.storage) {
      var r = await window.storage.get(KEY);
      if (r && r.value) { records = JSON.parse(r.value); return; }
    }
    var s = localStorage.getItem(KEY);
    if (s) records = JSON.parse(s);
  } catch (e) { records = []; }
}
async function save() {
  try {
    if (window.storage) { await window.storage.set(KEY, JSON.stringify(records)); return true; }
    localStorage.setItem(KEY, JSON.stringify(records));
    return true;
  } catch (e) {
    return false;
  }
}

/* 탭 */
function tab(n) {
  [1,2,3].forEach(function(i){
    document.getElementById("t"+i).className = (i===n ? "on" : "");
    document.getElementById("s"+i).className = (i===n ? "" : "hide");
  });
  if (n===2) drawHistory();
  if (n===3) drawPolicy();
}
document.getElementById("t1").onclick = function(){ tab(1); };
document.getElementById("t2").onclick = function(){ tab(2); };
document.getElementById("t3").onclick = function(){ tab(3); };

/* 사진 */
var fileEl = document.getElementById("file");
var dropEl = document.getElementById("drop");
var thumb = null;

/* 이력 저장용으로 96px 썸네일을 따로 만든다 (원본은 용량이 커서 저장에 실패함) */
function makeThumb(dataURL, done) {
  var im = new Image();
  im.onload = function() {
    var side = 96, cv = document.createElement("canvas");
    cv.width = side; cv.height = side;
    var scale = Math.max(side / im.width, side / im.height);
    var w = im.width * scale, h = im.height * scale;
    cv.getContext("2d").drawImage(im, (side - w) / 2, (side - h) / 2, w, h);
    try { done(cv.toDataURL("image/jpeg", 0.7)); } catch (e) { done(null); }
  };
  im.onerror = function(){ done(null); };
  im.src = dataURL;
}

function accept(f) {
  if (!f) return;
  var isImage = (f.type && f.type.indexOf("image") === 0) ||
                /\.(jpe?g|png|gif|webp|heic|heif)$/i.test(f.name || "");
  if (!isImage) return;
  mime = (f.type && f.type.indexOf("image") === 0) ? f.type : "image/jpeg";
  var rd = new FileReader();
  rd.onload = function() {
    img = rd.result;
    b64 = String(rd.result).split(",")[1];
    thumb = null;
    makeThumb(img, function(t){ thumb = t; });
    document.getElementById("dropinner").innerHTML = '<img src="' + img + '" alt="올린 사진">';
    document.getElementById("out").innerHTML = "";
    current = null;
    sync();
  };
  rd.onerror = function() {
    document.getElementById("out").innerHTML = '<p class="err">사진을 읽지 못했습니다. 다른 파일로 시도해 주세요.</p>';
  };
  rd.readAsDataURL(f);
}

fileEl.onchange = function(e) { accept(e.target.files && e.target.files[0]); };

["dragenter","dragover"].forEach(function(ev){
  dropEl.addEventListener(ev, function(e){ e.preventDefault(); dropEl.classList.add("over"); });
});
["dragleave","drop"].forEach(function(ev){
  dropEl.addEventListener(ev, function(e){ e.preventDefault(); dropEl.classList.remove("over"); });
});
dropEl.addEventListener("drop", function(e){
  if (e.dataTransfer && e.dataTransfer.files) accept(e.dataTransfer.files[0]);
});
window.addEventListener("paste", function(e){
  var items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (var i = 0; i < items.length; i++) {
    if (items[i].type.indexOf("image") === 0) { accept(items[i].getAsFile()); break; }
  }
});

/* ── 질의응답 입력 ── */
var Q = [
  { id:"item", label:"1. 무엇이 고장났나요?", type:"one", free:"직접 입력", opts:[
    "무선 마우스","키보드","선풍기","냉장고","세탁기","스마트폰","노트북","무선 이어폰","의류·지퍼","의자·가구" ] },
  { id:"age", label:"2. 얼마나 쓰셨나요?", type:"one", opts:[
    "1년 미만","1~3년","3~7년","7년 이상","기억나지 않음" ] },
  { id:"symp", label:"3. 어떤 증상인가요? (여러 개 선택 가능)", type:"many", free:"직접 입력", opts:[
    "전원이 안 켜짐","켜지는데 작동은 안 됨","작동이 자꾸 끊김","이상한 소리·진동","충전이 안 됨",
    "물이 새거나 눅눅함","냄새·발열","부품이 헐거워짐","깨지거나 찢어짐" ] },
  { id:"tried", label:"4. 이미 해보신 것이 있나요? (여러 개 선택 가능)", type:"many", opts:[
    "아직 아무것도","청소해봄","껐다 켜봄·초기화","케이블·배터리 바꿔봄","분해해봄" ] },
  { id:"parts", label:"5. 부품에 대해 안내받은 내용이 있나요?", type:"one", opts:[
    "문의한 적 없음","부품이 있다고 함","단종됐다고 함","수리비가 새것과 비슷하다고 함" ] }
];

var A = {};

function renderQuiz() {
  var html = Q.map(function(q){
    var opts = q.opts.map(function(o){
      var on = (q.type === "one") ? (A[q.id] === o) : ((A[q.id]||[]).indexOf(o) >= 0);
      return '<button class="chip' + (on ? " on" : "") + '" data-q="' + q.id + '" data-o="' + esc(o) + '">' + esc(o) + "</button>";
    }).join("");
    var free = q.free
      ? '<input class="freein" data-q="' + q.id + '" placeholder="' + q.free + '" value="' +
        esc(A[q.id + "_free"] || "") + '">'
      : "";
    return '<div class="q"><span class="q-label">' + q.label + "</span>" +
           '<div class="chips">' + opts + "</div>" + free + "</div>";
  }).join("");
  document.getElementById("quiz").innerHTML = html + '<button class="ghost" id="clearq">답변 지우기</button>';

  Array.prototype.forEach.call(document.querySelectorAll("#quiz .chip"), function(c){
    c.onclick = function(){
      var q = c.getAttribute("data-q"), o = c.getAttribute("data-o");
      var def = Q.filter(function(x){ return x.id === q; })[0];
      if (def.type === "one") {
        A[q] = (A[q] === o) ? null : o;
      } else {
        var arr = A[q] || [];
        var i = arr.indexOf(o);
        if (i >= 0) arr.splice(i, 1); else arr.push(o);
        A[q] = arr;
      }
      renderQuiz(); compose();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("#quiz .freein"), function(inp){
    inp.oninput = function(){ A[inp.getAttribute("data-q") + "_free"] = inp.value; compose(); };
  });
  document.getElementById("clearq").onclick = function(){
    A = {}; renderQuiz(); noteEl.value = ""; sync();
  };
}

function compose() {
  var item = [A.item, A.item_free].filter(Boolean).join(" ").trim();
  var symp = ((A.symp || []).concat(A.symp_free ? [A.symp_free] : [])).filter(Boolean);
  var tried = (A.tried || []).filter(function(t){ return t !== "아직 아무것도"; });

  var parts = [];
  if (item) parts.push(item + (A.age && A.age !== "기억나지 않음" ? ", " + A.age + " 사용" : ""));
  else if (A.age) parts.push(A.age + " 사용한 물건");
  if (symp.length) parts.push("증상: " + symp.join(", "));
  if (tried.length) parts.push("이미 해본 것: " + tried.join(", "));
  else if ((A.tried || []).length) parts.push("아직 아무 조치도 하지 않음");
  if (A.parts === "부품이 있다고 함") parts.push("제조사에서 부품이 있다고 안내받음");
  if (A.parts === "단종됐다고 함") parts.push("제조사에서 부품이 단종됐다고 안내받음");
  if (A.parts === "수리비가 새것과 비슷하다고 함") parts.push("수리비가 새 제품 가격과 비슷하다는 안내를 받음");

  noteEl.value = parts.join(". ") + (parts.length ? "." : "");
  document.getElementById("out").innerHTML = "";
  current = null;
  sync();
}

var noteEl = document.getElementById("note");
function sync() {
  document.getElementById("run").disabled = !(noteEl.value.trim() || b64);
}
noteEl.addEventListener("input", sync);
renderQuiz();
sync();

/* ── 수리 도해 ──
   외부 이미지를 불러오지 않고 앱 안에서 직접 그린다.
   저작권 문제가 없고 오프라인에서도 표시된다. */

  var t = String(name || "").toLowerCase();
  for (var i = 0; i < DG_KEY.length; i++) {
    for (var j = 0; j < DG_KEY[i].k.length; j++) {
      if (t.indexOf(DG_KEY[i].k[j].toLowerCase()) >= 0) return DIAGRAMS[DG_KEY[i].d];
    }
  }
  var byCat = DG_CAT[category];
  return (byCat && DIAGRAMS[byCat]) ? DIAGRAMS[byCat] : DIAGRAMS.generic;
}

var FALLBACK = {
  item_name:"미확인 생활용품", category:"기타", confidence:"낮음",
  symptom:"설명만으로는 원인을 좁히기 어렵습니다. 증상이 나타나는 조건을 더 적어주세요.",
  difficulty:"전문가 필요",
  steps:["증상이 언제 나타나는지 기록합니다","전원과 케이블 등 외부 요인을 먼저 배제합니다","제조사에 부품 보유 여부를 문의합니다"],
  tools:["없음"],
  cost_min:0, cost_max:50000,
  parts_risk:"단종 우려", parts_reason:"제품을 특정하지 못해 부품 상황을 확인할 수 없습니다.",
  safety:""
};

function localDiagnose(note, hint) {
  var t = String(note || "").toLowerCase();
  for (var i = 0; i < RULES.length; i++) {
    for (var j = 0; j < RULES[i].k.length; j++) {
      if (t.indexOf(RULES[i].k[j].toLowerCase()) >= 0) {
        return JSON.parse(JSON.stringify(RULES[i].v));
      }
    }
  }
  var fb = JSON.parse(JSON.stringify(FALLBACK));
  if (hint) fb.item_name = hint;
  return fb;
}

/* 모델이 규격을 살짝 벗어나도 화면이 깨지지 않게 정리한다 */
var DIFFS = ["자가수리 가능", "부분 수리", "전문가 필요", "수리 불가"];
var RISKS = ["조달 가능", "단종 우려", "조달 불가"];
function pick(v, list, fallback) {
  var s = String(v == null ? "" : v).replace(/\s+/g, "");
  for (var i = 0; i < list.length; i++) {
    if (list[i].replace(/\s+/g, "") === s) return list[i];
  }
  return fallback;
}
function normalize(r) {
  return {
    item_name: r.item_name || "이름 미상",
    category: CO2[r.category] ? r.category : "기타",
    confidence: r.confidence || "보통",
    symptom: r.symptom || "",
    difficulty: pick(r.difficulty, DIFFS, "전문가 필요"),
    steps: Array.isArray(r.steps) ? r.steps : [],
    tools: Array.isArray(r.tools) ? r.tools : [],
    cost_min: Number(r.cost_min) || 0,
    cost_max: Number(r.cost_max) || 0,
    parts_risk: pick(r.parts_risk, RISKS, "조달 가능"),
    parts_reason: r.parts_reason || "",
    safety: r.safety || ""
  };
}

/* 진단 */
document.getElementById("run").onclick = async function() {
  var note = document.getElementById("note").value.trim();
  if (!b64 && !note) return;
  var btn = this, out = document.getElementById("out");
  btn.disabled = true; btn.textContent = "진단하는 중";
  out.innerHTML = "";
  try {
    var res = await fetch("/api/diagnose", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        note: note,
        image: b64 ? { media_type: mime, data: b64 } : null
      })
    });
    var data = await res.json();
    if (!res.ok || !data || !data.result) {
      throw new Error((data && data.error) ? data.error : ("응답 코드 " + res.status));
    }
    current = normalize(data.result);
    out.innerHTML = slip(current) + '<button class="cta dark" id="save">수리 이력에 저장</button>';
    document.getElementById("save").onclick = async function() {
      records.unshift(Object.assign({}, current, {
        id: Date.now(),
        date: new Date().toISOString().slice(0,10),
        co2: CO2[current.category] || CO2["기타"],
        thumb: thumb
      }));
      var ok = await save();
      this.disabled = true;
      this.textContent = ok ? "이력에 저장됨" : "이 화면에만 저장됨";
    };
  } catch (e) {
    demoMode = true;
    current = normalize(localDiagnose(note, [A.item, A.item_free].filter(Boolean).join(" ").trim()));
    out.innerHTML = slip(current, true) + '<button class="cta dark" id="save">수리 이력에 저장</button>';
    document.getElementById("save").onclick = async function() {
      records.unshift(Object.assign({}, current, {
        id: Date.now(),
        date: new Date().toISOString().slice(0,10),
        co2: CO2[current.category] || CO2["기타"],
        thumb: thumb
      }));
      var ok2 = await save();
      this.disabled = true;
      this.textContent = ok2 ? "이력에 저장됨" : "이 화면에만 저장됨";
    };
  }
  btn.disabled = false; btn.textContent = "진단 받기";
};

/* 진단서 */
function slip(r, isDemo) {
  var co2 = CO2[r.category] || CO2["기타"];
  var inEU = EU_SCOPE.indexOf(r.category) >= 0;
  var risky = r.parts_risk !== "조달 가능";
  var steps = (r.steps || []).map(function(s){ return "<li>" + esc(s) + "</li>"; }).join("");

  return '<article class="slip">' +
    (isDemo ? '<div class="demo">시연 모드 · 내장 규칙 기반 추정입니다. AI 진단이 아닙니다.</div>' : '') +
    '<div class="slip-head"><div><h2>' + esc(r.item_name) + '</h2>' +
    '<span class="cat">' + esc(r.category) + '</span></div>' +
    '<span class="serial">No. ' + String(Date.now()).slice(-6) + '</span></div>' +

    '<div class="verdict" data-level="' + esc(r.difficulty) + '">' + esc(r.difficulty) +
    '<em>확신도 ' + esc(r.confidence) + '</em></div>' +

    row("추정 원인", esc(r.symptom)) +
    '<div class="row"><span class="row-label">수리 흐름</span>' +
    pickDiagram(r.item_name, r.category) +
    '<span class="sub">이해를 돕기 위한 개념도입니다. 실제 제품의 구조와 다를 수 있습니다.</span></div>' +
    row("수리 방법", "<ol>" + steps + "</ol>") +
    ((r.tools && r.tools.length) ? row("필요 공구", esc(r.tools.join(", "))) : "") +
    row("예상 비용", num(r.cost_min) + "원 ~ " + num(r.cost_max) + "원") +
    row("부품 조달", '<span class="' + (risky ? "flag" : "ok") + '">' + esc(r.parts_risk) +
        '</span><span class="sub">' + esc(r.parts_reason) + '</span>') +

    (r.safety ? '<p class="safety">' + esc(r.safety) + '</p>' : "") +

    '<div class="gain">고쳐 쓰면 약 <b>' + co2 + 'kg</b> CO&#8322;e를 아낍니다' +
    '<span class="sub">같은 제품을 새로 만들 때 나오는 배출량 추정치</span></div>' +

    '<div class="eu">' + (inEU
      ? "이 품목은 EU 수리권 지침(2024/1799) 적용 대상입니다. 유럽에서는 제조사가 합리적인 기간과 가격으로 수리를 제공할 의무가 있습니다."
      : "이 품목은 EU 수리권 지침의 명시적 대상은 아닙니다. 한국에는 두 경우 모두 강제 규정이 없습니다.") +
    '</div></article>';
}
function row(label, body) {
  return '<div class="row"><span class="row-label">' + label + '</span><div class="row-body">' + body + '</div></div>';
}

/* 수리 이력 */
function drawHistory() {
  var el = document.getElementById("s2");
  if (!records.length) {
    el.innerHTML = '<p class="empty">아직 저장된 수리가 없습니다. 진단 탭에서 첫 물건을 올려보세요.</p>';
    return;
  }
  var total = records.reduce(function(a,b){ return a + (b.co2||0); }, 0);
  var fixed = records.filter(function(r){ return r.difficulty !== "수리 불가"; }).length;
  var items = records.map(function(r){
    return "<li>" + (r.thumb ? '<img src="' + r.thumb + '" alt="">' : "") +
      "<div><b>" + esc(r.item_name) + "</b><span class=\"sub\">" +
      esc(r.date) + " &middot; " + esc(r.difficulty) + " &middot; " + r.co2 + "kg</span></div></li>";
  }).join("");

  el.innerHTML =
    '<div class="stats">' +
      "<div><b>" + num(total) + "</b><span>kg CO&#8322;e 절감</span></div>" +
      "<div><b>" + fixed + "</b><span>건 수리 가능</span></div>" +
      "<div><b>" + records.length + "</b><span>건 진단</span></div>" +
    "</div><ul class=\"list\">" + items + "</ul>" +
    '<button class="reset" id="reset">이력 전체 지우기</button>';

  document.getElementById("reset").onclick = async function() {
    records = []; await save(); drawHistory();
  };
}

/* 수리권 데이터 */
function drawPolicy() {
  var el = document.getElementById("s3");
  var blocked = records.filter(function(r){ return r.parts_risk !== "조달 가능"; });
  var byCat = {};
  blocked.forEach(function(r){ byCat[r.category] = (byCat[r.category]||0) + 1; });
  var lost = blocked.reduce(function(a,b){ return a + (b.co2||0); }, 0);

  var html = '<p class="lede">한국에는 전자폐기물이 얼마나 발생하고 왜 수리되지 못하는지 보여주는 공식 통계가 없습니다. 이 화면은 사용자들의 수리 실패 기록을 모아 그 빈칸을 채웁니다.</p>' +
    '<div class="bigstat"><b>' + blocked.length + '</b><span>건이 부품 때문에 막혔습니다</span></div>';

  if (blocked.length) {
    html += '<div class="bars">' + Object.keys(byCat).map(function(k){
      return '<div class="bar"><span>' + esc(k) + '</span><i style="width:' +
        ((byCat[k]/blocked.length)*100) + '%"></i><em>' + byCat[k] + '</em></div>';
    }).join("") + "</div>" +
    '<p class="lost">고칠 수 있었다면 아끼는 양: 약 ' + num(lost) + 'kg CO&#8322;e</p>' +
    '<button class="cta" id="brief">정책 브리프 만들기</button><div id="briefout"></div>';
  } else {
    html += '<p class="empty">아직 부품 문제로 막힌 기록이 없습니다.</p>';
  }
  el.innerHTML = html;

  var bb = document.getElementById("brief");
  if (bb) bb.onclick = async function() {
    var btn = this, o = document.getElementById("briefout");
    btn.disabled = true; btn.textContent = "작성하는 중"; o.innerHTML = "";
    try {
      var rows = blocked.map(function(r){
        return "- " + r.item_name + "(" + r.category + ") / " + r.parts_risk + " / 사유: " + r.parts_reason;
      }).join("\n");
      var res = await fetch("/api/brief", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt:
            "아래는 시민들이 수리를 시도했으나 부품 조달 문제로 막힌 사례 기록입니다.\n\n" + rows +
            "\n\n이 데이터를 근거로 한국의 수리권 제도 개선을 요구하는 짧은 정책 브리프를 작성하세요.\n" +
            "조건:\n- 400자 내외, 한국어\n- 구성: 관찰된 문제 / 데이터가 보여주는 것 / 제안하는 조치\n" +
            "- 현재 순환경제사회 전환 촉진법 제20조가 권고 수준에 머무는 점을 언급\n" +
            "- 과장 없이 데이터가 뒷받침하는 범위에서만 주장\n- 표본이 작으면 그 한계를 솔직히 명시\n- 마크다운 없이 평문으로"
        })
      });
      var data = await res.json();
      if (!res.ok || !data || !data.text) throw new Error("brief");
      o.innerHTML = '<div class="brief">' + esc(data.text) + "</div>";
    } catch (e) {
      var cats = Object.keys(byCat).join(", ");
      o.innerHTML = '<div class="brief">' + esc(
        "[시연 모드 · 내장 서식으로 작성된 예시입니다]\n\n" +
        "관찰된 문제\n" +
        "이용자들이 수리를 시도했으나 부품을 구할 수 없어 중단된 사례가 " + blocked.length + "건 기록됐습니다. " +
        "해당 품목군은 " + cats + "입니다.\n\n" +
        "데이터가 보여주는 것\n" +
        "고장의 원인이 수리 기술의 부재가 아니라 부품 공급의 단절에 있다는 점입니다. " +
        "고칠 수 있었다면 약 " + lost + "kg CO2e의 배출을 피할 수 있었습니다. " +
        "다만 표본이 " + blocked.length + "건에 불과해 전국 실태를 대표하지는 못합니다.\n\n" +
        "제안하는 조치\n" +
        "현행 순환경제사회 전환 촉진법 제20조는 예비부품 확보를 권고하는 데 그칩니다. " +
        "부품 의무 보유 기간을 품목별로 명시하고, 보유 현황을 공개하도록 전환할 필요가 있습니다. " +
        "아울러 수리 실패 사유를 수집하는 공식 통계 체계가 마련돼야 합니다."
      ) + "</div>";
    }
    btn.disabled = false; btn.textContent = "정책 브리프 만들기";
  };
}

load();
